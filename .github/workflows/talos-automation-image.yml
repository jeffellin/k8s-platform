name: talos-automation image

# Builds ghcr.io/jeffellin/talos-automation from image/Dockerfile and pushes it to the GitHub Container Registry.
# No secrets needed: it logs in with the workflow's GITHUB_TOKEN (permission packages: write). Pull requests only build (no push).
# One-time, manual: after the first push, set the package visibility to Public (GitHub > Packages > talos-automation > Package settings),
# otherwise the cluster's Jobs cannot pull it without an imagePullSecret.
on:
  push:
    branches: [main]
    paths:
      - image/Dockerfile
      - .dockerignore
      - image/scripts/**
      - .github/workflows/talos-automation-image.yml
    tags: ["image-v*"]
  pull_request:
    paths:
      - image/Dockerfile
      - .dockerignore
      - image/scripts/**
      - .github/workflows/talos-automation-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jeffellin/talos-automation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=talos-v1.14.5
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
