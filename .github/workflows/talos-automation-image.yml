name: talos-automation image

# Builds ellinj/talos-automation from image/Dockerfile and pushes it to Docker Hub.
# Needs repository secrets: DOCKERHUB_USERNAME (ellinj) and DOCKERHUB_TOKEN (a Docker Hub access token with write scope).
on:
  push:
    branches: [main]
    paths:
      - image/Dockerfile
      - .dockerignore
      - hack/clone-talos-vm.sh
      - hack/talos-gen-config.sh
      - hack/talos-apply-bootstrap.sh
      - hack/talos-apply-worker.sh
      - .github/workflows/talos-automation-image.yml
    tags: ["image-v*"]
  workflow_dispatch:

env:
  IMAGE: ellinj/talos-automation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=talos-v1.14.5
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
