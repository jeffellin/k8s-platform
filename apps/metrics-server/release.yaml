apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: metrics-server, namespace: kube-system}
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: metrics-server, namespace: kube-system}
spec:
  interval: 30m
  # Slow image pulls (F20): give installs time and keep retrying instead of going Failed.
  install:
    timeout: 15m
    remediation: {retries: -1}
  upgrade:
    timeout: 15m
    remediation: {retries: 3}
  chart:
    spec:
      chart: metrics-server
      version: 3.x
      sourceRef: {kind: HelmRepository, name: metrics-server}
  values:
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
