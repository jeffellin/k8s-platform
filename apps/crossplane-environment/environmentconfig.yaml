# One EnvironmentConfig per Proxmox *cluster* (one API endpoint + token). Per-node settings live inside.
# Read by the TalosCluster composition via function-environment-configs. No secret values here:
# the token is referenced by Secret name; the Secret is created out of band (not in Git).
#
# Templates: a full clone to another node needs shared storage, and local-lvm is not shared, so each node
# that hosts Talos VMs needs its own template. `pve` has VM 9100 (Talos v1.14.5). `pve2` uses 9102, a full clone of 9100 on shared storage, so it can be cloned to pve2;
# a node whose template is not owned by `pve` needs TEMPLATE_NODE support (backlog F19). Add pve3 when a template exists (hack/build-talos-template.sh).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata: {name: homelab}
data:
  proxmox:
    endpoint: https://192.168.1.52:8006/api2/json
    tokenSecretRef: {namespace: talos-automation, name: proxmox-token}   # keys PVE_ENDPOINT, PVE_TOKEN_ID, PVE_TOKEN_SECRET
    insecureTLS: true            # self-signed certificate
    defaultNode: pve
    nodes:
      pve:
        storage: local-lvm
        bridge: vmbr1
        templates:
          v1.14.5: 9100
      pve2:
        storage: truenas-fast-storage   # must be shared: Proxmox rejects a cross-node clone (template is owned by pve) onto local-lvm
        cloudInitStorage: local-lvm     # cloud-init drive stays local: Proxmox cannot write the ISO to the truenasplugin iSCSI LUN at start
        bridge: vmbr1                   # verified: vmbr1 on pve2 has the VLAN 10 uplink (nic0.10)
        templates:
          v1.14.5: 9102          # full clone of 9100 on shared storage (owned by node pve; TEMPLATE_NODE defaults to pve)
  network:
    prefix: 22                   # VLAN 10 = 192.168.8.0/22 (native on vmbr1, no VLAN tag)
    gateway: 192.168.10.1
    dns: 192.168.10.1
    searchDomain: ellin.net
  vm:
    cores: 4
    memoryMiB: 8192
    systemDiskGiB: 64
    dataDiskGiB: 50
  talos:
    version: v1.14.5
    schematic: 88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b
    image: ellinj/talos-automation:dev
  git:                           # repo the new cluster's Flux syncs (clusters/<name>/ must already be committed)
    url: https://github.com/jeffellin/k8s-platform.git
    branch: main
  flux:
    operatorVersion: v0.62.1     # what lab-manager runs
