apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: external-dns, namespace: external-dns}
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/external-dns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: external-dns, namespace: external-dns}
spec:
  interval: 30m
  # Slow image pulls (F20): give installs time and keep retrying instead of going Failed.
  install:
    timeout: 15m
    remediation: {retries: -1}
  upgrade:
    timeout: 15m
    remediation: {retries: 3}
  chart:
    spec:
      chart: external-dns
      version: 1.x
      sourceRef: {kind: HelmRepository, name: external-dns}
  values:
    provider: {name: aws}
    policy: upsert-only      # chart schema requires it; never deletes records
    sources: [service, ingress, contour-httpproxy]
    txtOwnerId: ${external_dns_txt_id}
    extraArgs:
      - --zone-id-filter=${zone_id}
    env:
      - name: AWS_REGION
        value: ${aws_region}
      - name: AWS_ACCESS_KEY_ID
        valueFrom: {secretKeyRef: {name: aws-credentials, key: access-key-id}}
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom: {secretKeyRef: {name: aws-credentials, key: secret-access-key}}
