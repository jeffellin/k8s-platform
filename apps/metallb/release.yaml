apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: metallb, namespace: metallb-system}
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: metallb, namespace: metallb-system}
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: 0.15.x
      sourceRef: {kind: HelmRepository, name: metallb}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    speaker:
      # false (default): MetalLB skips nodes labelled exclude-from-external-load-balancers (control planes).
      # Set metallb_ignore_exclude_lb: "true" per cluster for single-node clusters.
      ignoreExcludeLB: ${metallb_ignore_exclude_lb:=false}
