apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: jetstack, namespace: cert-manager}
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cert-manager, namespace: cert-manager}
spec:
  interval: 30m
  # Slow image pulls (F20): give installs time and keep retrying instead of going Failed.
  install:
    timeout: 15m
    remediation: {retries: -1}
  upgrade:
    timeout: 15m
    remediation: {retries: 3}
  chart:
    spec:
      chart: cert-manager
      version: 1.x
      sourceRef: {kind: HelmRepository, name: jetstack}
  values:
    crds: {enabled: true}
