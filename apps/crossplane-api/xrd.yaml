# TalosCluster: one object -> one Talos cluster on Proxmox (1 control plane + N workers, N>=0).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: talosclusters.platform.ellin.net
spec:
  scope: Namespaced
  group: platform.ellin.net
  names: {kind: TalosCluster, plural: talosclusters}
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - {name: CP, type: string, jsonPath: ".spec.network.controlPlaneIP"}
    - {name: WORKERS, type: integer, jsonPath: ".spec.workers.count"}
    - {name: PHASE, type: string, jsonPath: ".status.phase"}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [network]
            properties:
              proxmoxRef:
                type: string
                default: homelab
                description: Name of the EnvironmentConfig that describes the Proxmox cluster.
              talosVersion: {type: string, default: v1.14.5}
              kubernetesVersion: {type: string, default: v1.37.1}
              node:
                type: string
                description: Proxmox node to place VMs on (default from the EnvironmentConfig).
              storage:
                type: string
                maxLength: 64
                pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                description: Proxmox storage ID for the VM system and data disks (default from the node's EnvironmentConfig entry). Must exist on the target node.
              network:
                type: object
                required: [controlPlaneIP]
                properties:
                  controlPlaneIP:
                    type: string
                    maxLength: 15
                    pattern: '^192\.168\.(8|9|10|11)\.([0-9]{1,3})$'
                    x-kubernetes-validations:
                    - rule: "int(self.split('.')[2]) * 256 + int(self.split('.')[3]) < 2064 || int(self.split('.')[2]) * 256 + int(self.split('.')[3]) > 2610"
                      message: "IP is inside the VLAN 10 DHCP range 192.168.8.16-192.168.10.50"
                  workerIPs:
                    type: array
                    default: []
                    maxItems: 20
                    items:
                      type: string
                      maxLength: 15
                      pattern: '^192\.168\.(8|9|10|11)\.([0-9]{1,3})$'
                      x-kubernetes-validations:
                      - rule: "int(self.split('.')[2]) * 256 + int(self.split('.')[3]) < 2064 || int(self.split('.')[2]) * 256 + int(self.split('.')[3]) > 2610"
                        message: "IP is inside the VLAN 10 DHCP range 192.168.8.16-192.168.10.50"
              controlPlane:
                type: object
                default: {}
                properties:
                  cpu: {type: integer, minimum: 2}
                  memoryMiB: {type: integer, minimum: 4096}
                  dataDiskGiB: {type: integer, minimum: 0}
              workers:
                type: object
                default: {count: 0}
                properties:
                  count: {type: integer, minimum: 0, default: 0}
                  cpu: {type: integer, minimum: 2}
                  memoryMiB: {type: integer, minimum: 4096}
                  dataDiskGiB: {type: integer, minimum: 0}
              loadBalancer:
                type: object
                properties:
                  range: {type: string, description: "MetalLB range, e.g. 192.168.11.10-192.168.11.20"}
            x-kubernetes-validations:
            - rule: "size(self.network.workerIPs) == self.workers.count"
              message: "network.workerIPs must have exactly workers.count entries"
            - rule: "oldSelf.workers.count == 0 || self.workers.count > 0"
              message: "workers.count cannot go back to 0 once it has been above 0 (use N>0 or rebuild the cluster)"
          status:
            type: object
            properties:
              phase: {type: string}
              controlPlane:
                type: object
                properties:
                  name: {type: string}
                  vmid: {type: integer}
              workerCount: {type: integer}
              vms:
                type: object
                properties:
                  total: {type: integer}
                  ready: {type: integer}
              proxmoxEndpoint: {type: string}
              metallbIgnoreExcludeLB: {type: boolean}
              kubeconfigSecret: {type: string}
              talosconfigSecret: {type: string}
