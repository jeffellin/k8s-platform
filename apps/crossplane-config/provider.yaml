# provider-kubernetes manages objects in the local cluster (and later in new clusters).
# InjectedIdentity => the provider pod's ServiceAccount is the identity, so it gets a fixed name
# (via DeploymentRuntimeConfig) and a ClusterRoleBinding. cluster-admin because Objects may be any kind;
# narrow later if the set of managed kinds becomes known.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata: {name: provider-kubernetes}
spec:
  serviceAccountTemplate:
    metadata: {name: provider-kubernetes}
  # Poll every 30s (default 10m) so Job status reaches TalosCluster status promptly.
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args: ["--poll=30s"]
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-kubernetes}
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.4.1
  runtimeConfigRef: {name: provider-kubernetes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: provider-kubernetes-cluster-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {kind: ServiceAccount, name: provider-kubernetes, namespace: crossplane-system}
