apiVersion: v1
kind: ConfigMap
metadata: {name: hello-html, namespace: hello-nginx}
data:
  index.html: |
    <!doctype html><title>Hello</title><h1>Hello, world from ${hello_host}!</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-nginx, namespace: hello-nginx}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello-nginx}}
  template:
    metadata: {labels: {app: hello-nginx}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]
      volumes:
        - name: html
          configMap: {name: hello-html}
---
apiVersion: v1
kind: Service
metadata: {name: hello-nginx, namespace: hello-nginx}
spec:
  selector: {app: hello-nginx}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-nginx
  namespace: hello-nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: contour
  tls:
    - hosts: ["${hello_host}"]
      secretName: hello-nginx-tls
  rules:
    - host: "${hello_host}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hello-nginx, port: {number: 80}}}
