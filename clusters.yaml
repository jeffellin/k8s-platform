# Single source of truth: which apps run on which cluster, and their options.
# Edit this, then run `hack/render.py` and commit the generated clusters/<name>/ files.
# Each app's name matches a directory under apps/. Ordering comes from apps/<app>/meta.yaml.
repo:
  url: https://github.com/jeffellin/k8s-platform-.git
  branch: main

defaults:
  # substituted into every app as ${var}
  cert_email: jeff@ellin.net
  aws_region: us-east-1
  zone_id: ZM4W2IR7IZJ3M          # Route53 public zone ellin.net (verified via API); not a secret

clusters:
  talos-test:                       # single-node Talos VM 155 (192.168.1.155)
    vars:
      external_dns_txt_id: talos-test
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # single node: the control plane must serve LoadBalancer IPs
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.1.156-192.168.1.160
      - name: local-path-provisioner
      - name: metrics-server
      - name: contour
      - name: cert-manager        # needs secrets/cert-manager/aws-credentials.sops.yaml
      - name: cluster-issuers
      - name: external-dns        # needs secrets/external-dns/aws-credentials.sops.yaml
      - name: hello-nginx
        options:
          hello_host: hello.ellin.net
  lab-manager:                      # single-node Talos VM 10056 (192.168.10.56, VLAN 10); the Crossplane manager
    vars:
      external_dns_txt_id: lab-manager
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # single node: the control plane must serve LoadBalancer IPs
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.10-192.168.11.14
      - name: local-path-provisioner
      - name: metrics-server
      - name: contour
      - name: cert-manager        # needs secrets/cert-manager/aws-credentials.sops.yaml
      - name: cluster-issuers
      - name: external-dns        # needs secrets/external-dns/aws-credentials.sops.yaml
      - name: hello-nginx
        options:
          hello_host: hello-manager.ellin.net
      - name: crossplane          # the cluster manager; enabled only here
      - name: crossplane-config   # functions + provider-kubernetes
      - name: crossplane-providerconfig   # ClusterProviderConfig (needs the provider's CRDs)
      - name: crossplane-environment      # EnvironmentConfig `homelab` (Proxmox settings for TalosCluster)
      - name: crossplane-api               # TalosCluster XRD + composition
  e2test:                           # built by Crossplane (TalosCluster e2test: 1 CP 192.168.10.64 + 1 worker .65); E4 demo
    secrets: manager                # AWS creds + sops-age are created by the platform Job (no SOPS files)
    vars:
      external_dns_txt_id: e2test
    apps:
      - name: metallb               # worker exists, so the control plane keeps its LB exclusion (default)
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.20-192.168.11.29
      - name: local-path-provisioner
      - name: metrics-server
      - name: contour
      - name: cert-manager
      - name: cluster-issuers
      - name: external-dns
      - name: hello-nginx
        options:
          hello_host: hello-e2test.ellin.net
  e2scale:                          # E5 test cluster: starts single node (192.168.10.66), worker .67 added later
    secrets: manager
    vars:
      external_dns_txt_id: e2scale
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # 0 workers: control plane must serve LB IPs; flip to false (remove) when the worker joins
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.30-192.168.11.39
      - name: local-path-provisioner
      - name: metrics-server
      - name: contour
      - name: cert-manager
      - name: cluster-issuers
      - name: external-dns
      - name: hello-nginx
        options:
          hello_host: hello-e2scale.ellin.net
