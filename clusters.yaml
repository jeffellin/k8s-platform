# Single source of truth: which apps run on which cluster, and their options.
# Edit this, then run `hack/render.py` and commit the generated clusters/<name>/ files.
# Each app's name matches a directory under apps/. Ordering comes from apps/<app>/meta.yaml.
# local-path-provisioner is retired (2026-11-12, nothing used it; backlog F22). apps/local-path-provisioner stays: to use it again add
# `- name: local-path-provisioner` to a cluster's apps. Clusters then have no StorageClass until one is added (Longhorn is planned).
repo:
  url: https://github.com/jeffellin/k8s-platform.git
  branch: main

defaults:
  # substituted into every app as ${var}
  cert_email: jeff@ellin.net
  aws_region: us-east-1
  zone_id: ZM4W2IR7IZJ3M          # Route53 public zone ellin.net (verified via API); not a secret

clusters:
  talos-test:                       # single-node Talos VM 155 (192.168.1.155)
    vars:
      external_dns_txt_id: talos-test
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # single node: the control plane must serve LoadBalancer IPs
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.1.156-192.168.1.160
      - name: metrics-server
      - name: contour
      - name: cert-manager        # needs secrets/cert-manager/aws-credentials.sops.yaml
      - name: cluster-issuers
      - name: external-dns        # needs secrets/external-dns/aws-credentials.sops.yaml
      - name: hello-nginx
        options:
          hello_host: hello.ellin.net
  lab-manager:                      # single-node Talos VM 10056 (192.168.10.56, VLAN 10); the Crossplane manager
    vars:
      external_dns_txt_id: lab-manager
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # single node: the control plane must serve LoadBalancer IPs
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.10-192.168.11.14
      - name: metrics-server
      - name: contour
      - name: cert-manager        # needs secrets/cert-manager/aws-credentials.sops.yaml
      - name: cluster-issuers
      - name: external-dns        # needs secrets/external-dns/aws-credentials.sops.yaml
      - name: crossplane          # the cluster manager; enabled only here
      - name: crossplane-config   # functions + provider-kubernetes
      - name: crossplane-providerconfig   # ClusterProviderConfig (needs the provider's CRDs)
      - name: crossplane-environment      # EnvironmentConfig `homelab` (Proxmox settings for TalosCluster)
      - name: crossplane-api               # TalosCluster XRD + composition
      - name: talos-clusters               # TalosCluster XRs (apps/talos-clusters/*.yaml, managed by hack/new-talos-cluster.sh)

  demo1:                              # Crossplane-built Talos cluster (XR apps/talos-clusters/demo1.yaml): CP 192.168.10.57, 0 worker(s)
    secrets: manager
    vars:
      external_dns_txt_id: demo1
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # 0 workers: the control plane must serve LB IPs; remove when workers are added
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.15-192.168.11.24
      - name: metrics-server
      - name: contour
      - name: cert-manager
      - name: cluster-issuers
      - name: external-dns
      - name: hello-nginx
        options:
          hello_host: hello-demo1.ellin.net

  demo2:                              # Crossplane-built Talos cluster (XR apps/talos-clusters/demo2.yaml): CP 192.168.10.58, 0 worker(s)
    secrets: manager
    vars:
      external_dns_txt_id: demo2
    apps:
      - name: metallb
        options:
          metallb_ignore_exclude_lb: "true"   # 0 workers: the control plane must serve LB IPs; remove when workers are added
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.25-192.168.11.34
      - name: metrics-server
      - name: longhorn                      # F22 trial, variant A: default path /var/mnt/longhorn on the system disk (docs/longhorn.md)
        options:
          longhorn_replicas: "1"            # one worker
      - name: contour
      - name: cert-manager
      - name: cluster-issuers
      - name: external-dns
      - name: hello-nginx
        options:
          hello_host: hello-demo2.ellin.net

  demo3:                              # Crossplane-built Talos cluster (XR apps/talos-clusters/demo3.yaml): CP 192.168.10.61, 2 worker(s)
    secrets: manager
    vars:
      external_dns_txt_id: demo3
    apps:
      - name: metallb
      - name: metallb-config
        options:
          metal_lb_address_pool: 192.168.11.50-192.168.11.59
      - name: metrics-server
      - name: longhorn                      # variant B: data on the user volume `longhorn` (/var/mnt/longhorn), 2 workers
        options:
          longhorn_replicas: "2"
      - name: contour
      - name: cert-manager
      - name: cluster-issuers
      - name: external-dns
      - name: hello-nginx
        options:
          hello_host: hello-demo3.ellin.net
